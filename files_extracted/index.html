<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forældrehelte · Havets Helte</title>

<!-- ===== FACEBOOK / OPEN GRAPH — erstat DIT-LINK med din rigtige URL ===== -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://havets-helte.web.app">
<meta property="og:title" content="Forældrehelte — meld dig som frivillig 🔥">
<meta property="og:description" content="Havets Helte har brug for frivillige forældre til årets opgaver og vagter. Find en opgave der passer dig og meld dig på.">
<meta property="og:image" content="https://havets-helte.web.app/og-sankthans.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="da_DK">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  :root{
    --navy:#0b1f3a;--navy-mid:#152d50;--navy-light:#1e3d6e;--gold:#e8a020;
    --white:#f8f9fb;--text:#1a2535;--muted:#6b7a8d;--border:#d6dce6;
    --success:#1a7a4a;--success-bg:#eaf5ee;--success-border:#9fd4b4;--warn-bg:#fff8ec;--warn-border:#f5d080;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:var(--navy);min-height:100vh;color:var(--text)}
  .hero{background:var(--navy);padding:34px 24px 26px;text-align:center;border-bottom:1px solid var(--navy-light)}
  .hero-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
  .hero-badge i{font-size:15px}
  .hero-title{font-size:25px;font-weight:600;color:var(--white);margin-bottom:6px;letter-spacing:-.02em}
  .hero-desc{font-size:14px;color:#9db8d4;max-width:380px;margin:0 auto;line-height:1.6}
  .content{background:var(--white);min-height:calc(100vh - 170px);border-radius:20px 20px 0 0;margin-top:-2px;padding:26px 18px 48px;max-width:580px;margin-left:auto;margin-right:auto}

  .back-link{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);text-decoration:none;margin-bottom:16px;font-weight:500}
  .back-link:hover{color:var(--navy)}

  /* Hub list */
  .hub-event{display:block;background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:12px;text-decoration:none;color:inherit;transition:border-color .15s}
  .hub-event:hover{border-color:var(--navy-light)}
  .he-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .he-title{font-size:17px;font-weight:600;margin-bottom:3px}
  .he-meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px}
  .he-meta span{display:flex;align-items:center;gap:4px}
  .he-meta i{font-size:14px}
  .he-type{font-size:11px;font-weight:500;padding:3px 9px;border-radius:12px;background:#eef2f7;color:var(--muted);white-space:nowrap}
  .he-type.timed{background:#e8eefb;color:#2b4ea0}
  .he-type.task{background:#fdf0e0;color:#9a6209}
  .he-progress{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:10px}
  .he-progress-fill{height:100%;background:var(--success);border-radius:3px}
  .he-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
  .he-cta{color:var(--navy);font-weight:600;display:flex;align-items:center;gap:4px}

  /* Event detail */
  .info-strip{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .info-chip{flex:1;min-width:150px;background:#f3f5f8;border-radius:10px;padding:12px 14px;font-size:12px;color:var(--muted);line-height:1.5}
  .info-chip strong{display:block;font-size:13px;color:var(--text);margin-bottom:2px}
  .info-chip i{font-size:14px;color:var(--gold);margin-right:4px}
  .ev-desc{font-size:14px;color:var(--text);line-height:1.6;background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:10px;padding:13px 16px;margin-bottom:20px}

  .shift-section{margin-bottom:18px}
  .shift-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .shift-time{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:600;color:var(--text)}
  .shift-time i{font-size:16px;color:var(--muted)}
  .shift-sub{font-size:12px;color:var(--muted);font-weight:400;margin-left:4px}
  .shift-cap{font-size:12px;font-weight:500;padding:3px 9px;border-radius:12px}
  .cap-open{background:#e6f4ec;color:var(--success)}.cap-full{background:#f0f0f0;color:var(--muted)}
  .signups-list{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
  .signup-row{display:flex;align-items:center;gap:10px;padding:9px 13px;background:#f3f5f8;border-radius:10px;font-size:13px;color:var(--muted)}
  .signup-row.filled{background:var(--success-bg);border:1px solid var(--success-border);color:var(--success);font-weight:500}
  .signup-av{width:26px;height:26px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--muted);flex-shrink:0}
  .signup-av.filled-av{background:#c2e0ce;color:var(--success)}
  .join-btn{width:100%;padding:10px;background:#fff;border:1px solid var(--border);border-radius:10px;font-size:13px;font-weight:500;font-family:inherit;color:var(--navy);cursor:pointer}
  .join-btn:hover{border-color:var(--navy)}
  .join-btn:disabled{color:var(--muted);cursor:not-allowed;background:#f7f7f7}
  .req-adult-note{font-size:11px;color:#9a6209;margin-top:6px;display:flex;align-items:center;gap:5px}

  .modal-overlay{position:fixed;inset:0;background:rgba(11,31,58,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .modal-overlay.show{display:flex}
  .modal{background:#fff;border-radius:18px 18px 0 0;padding:24px 20px 32px;width:100%;max-width:580px}
  .modal-title{font-size:16px;font-weight:600;margin-bottom:2px}
  .modal-sub{font-size:13px;color:var(--muted);margin-bottom:18px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:5px}
  .field input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:9px;font-size:15px;font-family:inherit;color:var(--text);background:var(--white)}
  .field input:focus{outline:none;border-color:var(--navy-light)}
  .check-row{display:flex;align-items:center;gap:9px;margin-bottom:18px;font-size:13px;cursor:pointer}
  .check-row input{width:17px;height:17px;accent-color:var(--navy)}
  .modal-actions{display:flex;gap:10px}
  .btn-cancel{flex:1;padding:12px;background:#f3f5f8;border:none;border-radius:10px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;font-family:inherit}
  .btn-confirm{flex:2;padding:12px;background:var(--navy);border:none;border-radius:10px;font-size:14px;font-weight:600;color:#fff;cursor:pointer;font-family:inherit}
  .btn-confirm:hover{background:var(--navy-light)}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:24px;font-size:13px;font-weight:500;transition:transform .3s;z-index:60;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast i{color:#7dd4a0;font-size:16px}
  .contact-footer{text-align:center;font-size:13px;color:var(--muted);line-height:1.6;padding-top:16px;border-top:1px solid var(--border);margin-top:20px}
  .contact-footer a{color:var(--navy);font-weight:500}
  .state-msg{text-align:center;padding:50px 20px;color:var(--muted)}
  .state-msg i{font-size:40px;color:var(--border);margin-bottom:12px;display:block}

  .auth-bar{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-bottom:16px;min-height:34px}
  .btn-google{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:500;color:var(--text);cursor:pointer;font-family:inherit}
  .btn-google:hover{border-color:var(--navy)}
  .btn-google img{width:16px;height:16px}
  .user-chip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text)}
  .user-chip .uava{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
  .user-chip .logout{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;font-family:inherit;padding:0}
  .mine-card{background:#fff;border:1px solid var(--success-border);border-radius:14px;padding:16px;margin-bottom:18px}
  .mine-card h3{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .mine-card h3 i{color:var(--success)}
  .mine-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f3f5f8;border-radius:9px;margin-bottom:7px;font-size:13px}
  .mine-item:last-child{margin-bottom:0}
  .mine-item .mi-info{flex:1}
  .mine-item .mi-title{font-weight:500}
  .mine-item .mi-sub{color:var(--muted);font-size:12px}
  .mine-cancel{background:none;border:1px solid var(--border);border-radius:7px;padding:5px 10px;font-size:12px;color:var(--muted);cursor:pointer;font-family:inherit}
  .mine-cancel:hover{border-color:#c0392b;color:#c0392b}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-badge"><i class="ti ti-anchor"></i>Havets Helte</div>
  <div class="hero-title" id="heroTitle">Forældrehelte</div>
  <div class="hero-desc" id="heroDesc">Vores forening lever af forældre der giver en hånd. Find en opgave herunder og meld dig på.</div>
</div>

<div class="content">
  <div id="authBar" class="auth-bar"></div>
  <div id="mineWrap"></div>
  <div id="view"><div class="state-msg">Henter opgaver...</div></div>
  <div class="contact-footer" id="footer" style="display:none"></div>
</div>

<!-- Signup modal -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title" id="modal-title">Meld dig på</div>
    <div class="modal-sub" id="modal-sub"></div>
    <div class="field"><label>Dit navn</label><input type="text" id="m-name" placeholder="Fornavn Efternavn" autocomplete="name"></div>
    <div class="field"><label>Din mail</label><input type="email" id="m-email" placeholder="din@mail.dk" autocomplete="email"></div>
    <label class="check-row" id="adult-row" style="display:none"><input type="checkbox" id="m-adult">Jeg er over 18 år</label>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Annullér</button>
      <button class="btn-confirm" id="confirmBtn" onclick="confirmSignup()">Tilmeld mig</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><i class="ti ti-circle-check"></i>Du er tilmeldt — tak for hjælpen!</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, doc, getDoc, addDoc, setDoc, deleteDoc, onSnapshot, getDocs, query, where, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

// ====== SAMME firebaseConfig som i admin.html ======
const firebaseConfig = {
  apiKey: "INDSÆT_API_KEY",
  authDomain: "havets-helte.firebaseapp.com",
  projectId: "havets-helte",
  storageBucket: "havets-helte.appspot.com",
  messagingSenderId: "INDSÆT_SENDER_ID",
  appId: "INDSÆT_APP_ID"
};

let db = null, auth = null;
try { const _app = initializeApp(firebaseConfig); db = getFirestore(_app); auth = getAuth(_app); }
catch(e){ console.error('Firebase init fejlede — tjek config:', e); }

let currentUser = null;
const googleProvider = auth ? new GoogleAuthProvider() : null;
function doGoogleLogin(){ if(auth) signInWithPopup(auth, googleProvider).catch(e=>{ console.error(e); alert('Login mislykkedes — prøv igen.'); }); }
function doGoogleLogout(){ if(auth) signOut(auth); }
window.doGoogleLogin = doGoogleLogin; window.doGoogleLogout = doGoogleLogout;

// ===== APPS SCRIPT NOTIFIKATIONER (gratis via Google Workspace) =====
// Indsæt din web-app URL fra Apps Script og samme SHARED_SECRET som i Code.gs
const APPS_SCRIPT_URL = 'INDSÆT_APPS_SCRIPT_WEB_APP_URL';
const SHARED_SECRET   = 'SKIFT-MIG-til-en-laang-tilfaeldig-streng';

function notifySignup(payload) {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.startsWith('INDSÆT')) return;
  // no-cors: vi kan ikke læse svaret, men beskeden når frem (som Google Forms-tricket)
  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ ...payload, secret: SHARED_SECRET })
  }).catch(err => console.error('Notifikation fejlede:', err));
}

const params = new URLSearchParams(location.search);
const eventId = params.get('event');

// ===== AUTH STATE =====
function renderAuthBar() {
  const bar = document.getElementById('authBar');
  if (!auth) { bar.innerHTML=''; return; }
  if (currentUser) {
    const ini = (currentUser.displayName||currentUser.email||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
    bar.innerHTML = `<div class="user-chip"><div class="uava">${esc(ini)}</div><span>${esc(currentUser.displayName||currentUser.email)}</span><button class="logout" onclick="doGoogleLogout()">Log ud</button></div>`;
  } else {
    bar.innerHTML = `<button class="btn-google" onclick="doGoogleLogin()"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">Log ind med Google</button>`;
  }
}

let currentEvent = null;
let signups = [];
let pendingSlot = null;

if (!db) {
  document.getElementById('view').innerHTML = '<div class="state-msg"><i class="ti ti-alert-triangle"></i>Siden er ikke konfigureret endnu.<br>firebaseConfig mangler.</div>';
} else {
  if (auth) {
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      renderAuthBar();
      loadMine();
    });
  }
  if (eventId) loadEventDetail(eventId);
  else loadHub();
}

// ===== MINE TILMELDINGER =====
async function loadMine() {
  const wrap = document.getElementById('mineWrap');
  if (!currentUser) { wrap.innerHTML=''; return; }
  try {
    const snap = await getDocs(query(collection(db,'signups'), where('uid','==',currentUser.uid)));
    const mine = [];
    snap.forEach(d => mine.push({ id:d.id, ...d.data() }));
    if (mine.length === 0) { wrap.innerHTML=''; return; }
    // hent eventtitler
    const titles = {};
    for (const m of mine) {
      if (!titles[m.eventId]) {
        try { const ev = await getDoc(doc(db,'events',m.eventId)); if (ev.exists()) titles[m.eventId]=ev.data(); } catch(e){}
      }
    }
    let html = '<div class="mine-card"><h3><i class="ti ti-circle-check"></i>Mine tilmeldinger</h3>';
    mine.forEach(m => {
      const ev = titles[m.eventId];
      const slot = ev ? (ev.slots||[]).find(s=>s.id===m.slotId) : null;
      const slotLabel = slot ? (slot.label + (slot.sublabel?' · '+slot.sublabel:'')) : '';
      html += `<div class="mine-item"><div class="mi-info"><div class="mi-title">${esc(ev?ev.title:'Opgave')}</div><div class="mi-sub">${esc(slotLabel)}</div></div><button class="mine-cancel" onclick="cancelSignup('${m.id}')">Afmeld</button></div>`;
    });
    html += '</div>';
    wrap.innerHTML = html;
  } catch(e){ console.error(e); wrap.innerHTML=''; }
}

async function cancelSignup(signupId) {
  if (!confirm('Vil du afmelde denne tilmelding?')) return;
  try {
    await deleteDoc(doc(db,'signups',signupId));
    try { await deleteDoc(doc(db,'signupContacts',signupId)); } catch(e){}
    loadMine();
  } catch(e){ console.error(e); alert('Kunne ikke afmelde — prøv igen.'); }
}
window.cancelSignup = cancelSignup;

// ===== HUB: list of active events =====
function loadHub() {
  onSnapshot(query(collection(db,'events'), where('active','==',true)), (snap) => {
    const view = document.getElementById('view');
    const events = [];
    snap.forEach(d => events.push({ id:d.id, ...d.data() }));
    events.sort((a,b)=> (b.created?.seconds||0)-(a.created?.seconds||0));
    if (events.length === 0) {
      view.innerHTML = '<div class="state-msg"><i class="ti ti-calendar-off"></i>Der er ingen opgaver lige nu.<br>Kig forbi igen senere!</div>';
      return;
    }
    view.innerHTML = '';
    events.forEach(ev => renderHubCard(ev, view));
  });
  document.getElementById('footer').style.display='block';
  document.getElementById('footer').innerHTML = 'Havets Helte søspejdere';
}

function renderHubCard(ev, view) {
  const totalCap = (ev.slots||[]).reduce((s,sl)=>s+(sl.capacity||0),0);
  const a = document.createElement('a');
  a.className = 'hub-event';
  a.href = './?event='+ev.id;
  a.innerHTML = `
    <div class="he-head">
      <div style="flex:1">
        <div class="he-title">${esc(ev.title)}</div>
        <div class="he-meta">
          ${ev.dateText?`<span><i class="ti ti-calendar"></i>${esc(ev.dateText)}</span>`:''}
          ${ev.location?`<span><i class="ti ti-map-pin"></i>${esc(ev.location)}</span>`:''}
        </div>
      </div>
      <span class="he-type ${ev.type}">${ev.type==='timed'?'Vagter':'Opgaver'}</span>
    </div>
    <div class="he-progress"><div class="he-progress-fill" id="hubfill-${ev.id}" style="width:0%"></div></div>
    <div class="he-foot"><span id="hubcnt-${ev.id}">Henter...</span><span class="he-cta">Meld dig på<i class="ti ti-arrow-right"></i></span></div>
  `;
  view.appendChild(a);
  // live count
  onSnapshot(query(collection(db,'signups'), where('eventId','==',ev.id)), (s) => {
    const n = s.size;
    const fill = document.getElementById('hubfill-'+ev.id);
    const cnt = document.getElementById('hubcnt-'+ev.id);
    if (fill) fill.style.width = totalCap?Math.min(100,Math.round(n/totalCap*100))+'%':'0%';
    if (cnt) cnt.textContent = totalCap? `${n} af ${totalCap} pladser taget` : `${n} tilmeldte`;
  });
}

// ===== EVENT DETAIL =====
async function loadEventDetail(id) {
  const snap = await getDoc(doc(db,'events',id));
  if (!snap.exists() || snap.data().active === false) {
    document.getElementById('view').innerHTML = '<a class="back-link" href="./"><i class="ti ti-arrow-left"></i>Alle opgaver</a><div class="state-msg"><i class="ti ti-calendar-off"></i>Opgaven findes ikke længere.</div>';
    return;
  }
  currentEvent = { id, ...snap.data() };
  document.getElementById('heroTitle').textContent = currentEvent.title;
  document.getElementById('heroDesc').textContent = currentEvent.dateText || '';
  onSnapshot(query(collection(db,'signups'), where('eventId','==',id)), (s) => {
    signups = [];
    s.forEach(d => signups.push({ id:d.id, ...d.data() }));
    renderDetail();
  });
}

function renderDetail() {
  const ev = currentEvent;
  const view = document.getElementById('view');
  let html = '<a class="back-link" href="./"><i class="ti ti-arrow-left"></i>Alle opgaver</a>';
  html += '<div class="info-strip">';
  if (ev.location) html += `<div class="info-chip"><strong><i class="ti ti-map-pin"></i>Sted</strong>${esc(ev.location)}</div>`;
  html += `<div class="info-chip"><strong><i class="ti ti-clock"></i>${ev.type==='timed'?'Vagter':'Opgaver'}</strong>${(ev.slots||[]).length} ${ev.type==='timed'?'vagter at vælge':'opgaver at vælge'}</div></div>`;
  if (ev.description) html += `<div class="ev-desc">${esc(ev.description)}</div>`;

  (ev.slots||[]).forEach(slot => {
    const inSlot = signups.filter(s => s.slotId === slot.id);
    const remaining = Math.max(0, slot.capacity - inSlot.length);
    let rows = '';
    for (let i=0;i<slot.capacity;i++){
      if (inSlot[i]) {
        const ini = inSlot[i].name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
        const am = inSlot[i].adult?' · 18+':'';
        rows += `<div class="signup-row filled"><div class="signup-av filled-av">${esc(ini)}</div>${esc(inSlot[i].name)}${am}</div>`;
      } else {
        rows += `<div class="signup-row"><div class="signup-av"><i class="ti ti-user" style="font-size:12px"></i></div>Ledig plads</div>`;
      }
    }
    const capClass = remaining===0?'cap-full':'cap-open';
    const capText = remaining===0?'Fuldt':remaining+' ledig'+(remaining>1?'e':'');
    html += `<div class="shift-section">
      <div class="shift-header">
        <div class="shift-time"><i class="ti ti-${ev.type==='timed'?'clock':'point'}"></i>${esc(slot.label)}${slot.sublabel?`<span class="shift-sub">${esc(slot.sublabel)}</span>`:''}</div>
        <span class="shift-cap ${capClass}">${capText}</span>
      </div>
      <div class="signups-list">${rows}</div>
      <button class="join-btn" ${remaining===0?'disabled':''} onclick="openModal('${slot.id}')">${remaining===0?'Fyldt':'+ Meld dig på'}</button>
      ${slot.requiresAdult?'<div class="req-adult-note"><i class="ti ti-info-circle"></i>Mindst én voksen over 18 skal være på denne vagt</div>':''}
    </div>`;
  });
  view.innerHTML = html;
}

// ===== SIGNUP =====
function openModal(slotId) {
  const slot = currentEvent.slots.find(s=>s.id===slotId);
  pendingSlot = slot;
  document.getElementById('modal-title').textContent = currentEvent.title;
  document.getElementById('modal-sub').textContent = slot.label + (slot.sublabel?' · '+slot.sublabel:'');
  document.getElementById('adult-row').style.display = slot.requiresAdult ? 'flex' : 'none';
  // forudfyld hvis logget ind med Google
  if (currentUser) {
    if (currentUser.displayName) document.getElementById('m-name').value = currentUser.displayName;
    if (currentUser.email) document.getElementById('m-email').value = currentUser.email;
  }
  document.getElementById('modal-overlay').classList.add('show');
  document.getElementById('m-name').focus();
}
function closeModal(){ document.getElementById('modal-overlay').classList.remove('show'); pendingSlot=null; }

async function confirmSignup() {
  const name = document.getElementById('m-name').value.trim();
  const email = document.getElementById('m-email').value.trim();
  const adult = document.getElementById('m-adult').checked;
  if (!name || !email) { alert('Udfyld navn og mail.'); return; }
  if (!email.includes('@')) { alert('Tjek din mailadresse.'); return; }

  const slot = pendingSlot;
  const taken = signups.filter(s=>s.slotId===slot.id).length;
  if (taken >= slot.capacity) { alert('Pladsen blev desværre lige fyldt. Vælg en anden.'); closeModal(); return; }

  const btn = document.getElementById('confirmBtn');
  btn.disabled=true; btn.textContent='Tilmelder...';
  try {
    const signupData = { eventId: currentEvent.id, slotId: slot.id, name, adult, created: serverTimestamp() };
    const contactData = { eventId: currentEvent.id, name, email, created: serverTimestamp() };
    if (currentUser) { signupData.uid = currentUser.uid; contactData.uid = currentUser.uid; }
    const ref = await addDoc(collection(db,'signups'), signupData);
    // kontaktinfo i separat collection (kun ledere kan læse)
    await setDoc(doc(db,'signupContacts',ref.id), contactData);

    // gratis mail-notifikation via Apps Script (leder + bekræftelse til forælder)
    notifySignup({
      eventTitle: currentEvent.title,
      slotLabel: slot.label + (slot.sublabel ? ' · ' + slot.sublabel : ''),
      name, email, adult,
      location: currentEvent.location || '',
      dateText: currentEvent.dateText || ''
    });

    if (typeof gtag==='function') gtag('event','tilmelding',{opgave:currentEvent.title,slot:slot.label});
    closeModal();
    document.getElementById('m-name').value='';
    document.getElementById('m-email').value='';
    document.getElementById('m-adult').checked=false;
    const t=document.getElementById('toast'); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000);
    if (currentUser) loadMine();
  } catch(e){ console.error(e); alert('Noget gik galt — prøv igen.'); }
  finally { btn.disabled=false; btn.textContent='Tilmeld mig'; }
}

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
window.openModal=openModal; window.closeModal=closeModal; window.confirmSignup=confirmSignup;
</script>
</body>
</html>
