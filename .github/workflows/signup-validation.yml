name: Signup Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  invalid-payloads:
    name: Reject invalid signup payloads
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node for Vue app
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/www/package-lock.json

      - name: Install Vue dependencies
        working-directory: apps/www
        run: npm ci

      - name: Run invalid signup checks
        run: npx -y firebase-tools@latest emulators:exec --project havets-helte --only firestore "node scripts/invalid-signup-smoke.cjs"
