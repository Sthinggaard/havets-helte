name: Signup Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  invalid-payloads:
    name: Reject invalid signup payloads
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Set up Node for Vue app
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/www/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Vue dependencies
        working-directory: apps/www
        run: npm ci

      - name: Build Vue app
        working-directory: apps/www
        run: npm run build

      - name: Run invalid signup checks
        working-directory: ..
        run: npx -y firebase-tools@latest emulators:exec --project havets-helte --only functions,hosting "node scripts/invalid-signup-smoke.cjs"
