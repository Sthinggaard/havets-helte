name: Deploy

# Promotion pipeline: every push to main deploys dev, then stage. Prod is
# NEVER deployed automatically — deploying to the live site requires manually
# running this workflow from the Actions tab with environment "prod"
# (that manual trigger is the approval step; GitHub's built-in environment
# approval gates need a paid plan on private repos).
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - stage
          - prod

jobs:
  dev:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    uses: ./.github/workflows/_firebase-deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev
      firebase_alias: dev
      build_script: build:dev
      wif_provider: projects/986076619978/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
      wif_service_account: github-action@havets-helte-dev.iam.gserviceaccount.com

  stage:
    needs: [dev]
    if: >-
      !cancelled() && (
        (github.event_name == 'push' && needs.dev.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'stage')
      )
    uses: ./.github/workflows/_firebase-deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: stage
      firebase_alias: stage
      build_script: build:stage
      wif_provider: projects/658395766805/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
      wif_service_account: github-action@havets-helte-stage.iam.gserviceaccount.com

  prod:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    uses: ./.github/workflows/_firebase-deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: production
      firebase_alias: prod
      build_script: build:prod
      wif_provider: projects/148727737530/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
      wif_service_account: github-action-1266570338@havets-helte.iam.gserviceaccount.com
