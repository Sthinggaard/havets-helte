name: Deploy

# Branch -> environment promotion:
#   dev     -> dev    (havets-helte-dev)
#   stage   -> stage  (havets-helte-stage)
#   main    -> prod   (havets-helte)
# Also deployable on demand via the Actions tab (pick the environment).
on:
  push:
    branches:
      - dev
      - stage
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - stage
          - prod

# Serialize deploys per ref so a newer push to the same branch never races an
# in-flight deploy. Different branches/envs still deploy in parallel.
concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dev:
    if: github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    uses: ./.github/workflows/_firebase-deploy.yml
    with:
      environment: dev
      firebase_alias: dev
      build_script: build:dev
    secrets:
      service_account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}

  stage:
    if: github.ref == 'refs/heads/stage' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'stage')
    uses: ./.github/workflows/_firebase-deploy.yml
    with:
      environment: stage
      firebase_alias: stage
      build_script: build:stage
    secrets:
      service_account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGE }}

  prod:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')
    uses: ./.github/workflows/_firebase-deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: production
      firebase_alias: prod
      build_script: build:prod
      # Keyless auth via Workload Identity Federation — see ENVIRONMENTS.md.
      wif_provider: projects/148727737530/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
      wif_service_account: github-action-1266570338@havets-helte.iam.gserviceaccount.com
