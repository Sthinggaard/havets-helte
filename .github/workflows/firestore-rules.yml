name: Firestore Rules

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  rules:
    name: Validate Firestore rules
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Start Firestore emulator and validate rules file
        run: |
          firebase emulators:exec --only firestore "node -e \"console.log('firestore_rules_ok')\""
