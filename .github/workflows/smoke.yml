name: Smoke Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  emulators:
    name: Firebase emulator smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Set up Node for Vue app
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/www/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Vue dependencies
        working-directory: apps/www
        run: npm ci

      - name: Configure a test-only Functions secret
        run: printf '%s\n' 'PARENT_ACCESS_APPS_SCRIPT_SECRET=ci-smoke-test-secret' > .secret.local

      - name: Start Firestore and Functions emulators for the public signup smoke test
        working-directory: .
        run: npx -y firebase-tools@latest emulators:exec --project havets-helte --only firestore,functions "node scripts/smoke-signup.cjs"
