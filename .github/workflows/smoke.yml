name: Smoke Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  emulators:
    name: Firebase emulator smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start Firebase emulators and smoke test signup endpoint
        working-directory: ..
        run: npx -y firebase-tools@latest emulators:exec --project havets-helte --only auth,firestore,functions,hosting "node scripts/smoke-signup.cjs"
