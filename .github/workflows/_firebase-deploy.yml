name: Firebase Deploy (reusable)

# Reusable deploy job shared by every environment. The caller (deploy.yml)
# supplies the GitHub environment, the .firebaserc alias, the Vue build script,
# and the Workload Identity Federation provider + service account (keyless
# auth — org policy forbids service-account JSON keys).
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment name (dev / stage / production)
        required: true
        type: string
      firebase_alias:
        description: .firebaserc project alias to deploy (dev / stage / prod)
        required: true
        type: string
      build_script:
        description: npm script that builds the Vue app for this env
        required: true
        type: string
      wif_provider:
        description: Workload Identity provider resource name
        required: true
        type: string
      wif_service_account:
        description: Service account email to impersonate via Workload Identity Federation
        required: true
        type: string

jobs:
  deploy:
    name: Deploy ${{ inputs.firebase_alias }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    # Serialize deploys per environment so a newer run never races an in-flight
    # deploy of the same env; different envs still deploy independently.
    concurrency:
      group: firebase-deploy-${{ inputs.firebase_alias }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node for Functions
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Set up Node for Vue app
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/www/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Install Vue dependencies
        working-directory: apps/www
        run: npm ci

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ inputs.wif_provider }}
          service_account: ${{ inputs.wif_service_account }}

      - name: Deploy to Firebase
        env:
          FIREBASE_HOSTING_BUILD_SCRIPT: ${{ inputs.build_script }}
        run: npx -y firebase-tools@latest deploy --project ${{ inputs.firebase_alias }} --only hosting,functions:submitSignup
