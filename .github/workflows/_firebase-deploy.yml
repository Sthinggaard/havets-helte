name: Firebase Deploy (reusable)

# Reusable deploy job shared by every environment. The caller (deploy.yml)
# supplies the GitHub environment, the .firebaserc alias, the Vue build script,
# and either a Workload Identity Federation provider (preferred — no stored
# key) or a legacy service-account JSON secret.
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment name (dev / stage / production)
        required: true
        type: string
      firebase_alias:
        description: .firebaserc project alias to deploy (dev / stage / prod)
        required: true
        type: string
      build_script:
        description: npm script that builds the Vue app for this env
        required: true
        type: string
      wif_provider:
        description: Workload Identity provider resource name (leave empty to fall back to the JSON secret)
        required: false
        type: string
        default: ''
      wif_service_account:
        description: Service account email to impersonate via Workload Identity Federation
        required: false
        type: string
        default: ''
    secrets:
      service_account:
        description: Firebase service-account JSON for the target project (only needed when wif_provider is empty)
        required: false

jobs:
  deploy:
    name: Deploy ${{ inputs.firebase_alias }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node for Functions
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Set up Node for Vue app
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/www/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Install Vue dependencies
        working-directory: apps/www
        run: npm ci

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: inputs.wif_provider != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ inputs.wif_provider }}
          service_account: ${{ inputs.wif_service_account }}

      - name: Write service account credentials (legacy key-based auth)
        if: inputs.wif_provider == ''
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.service_account }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing service account secret for environment '${{ inputs.environment }}'"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$HOME/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy to Firebase
        env:
          FIREBASE_HOSTING_BUILD_SCRIPT: ${{ inputs.build_script }}
        run: npx -y firebase-tools@latest deploy --force --project ${{ inputs.firebase_alias }} --only hosting,functions,firestore:rules,storage
